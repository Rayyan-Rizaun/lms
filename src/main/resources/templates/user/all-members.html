<!DOCTYPE html>
<!--
    UC-01, PB-09 — the full member list: search, filter, sort, paginate,
    plus row-level suspend/reactivate. Sorting and pagination are hand-built,
    not components/data-table's or components/pagination's own header/page
    links, because this screen filters (q/status/memberType) AND sorts —
    templates/components/README.md says exactly this combination needs its
    own links so a sort click cannot drop the current filter.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">All Members · Library Management System</title>
</head>
<body>
<div id="content">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('All Members', 'Search, filter and manage membership status.', 'Membership Approval', @{/users/pending}, null)}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/users/all}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="flex:2 1 220px; margin:0;">
                    <label class="form-field__label" for="q">Search</label>
                    <input type="search" id="q" name="q" th:value="${q}" class="form-field__input"
                           placeholder="Name, membership no. or email" />
                </div>
                <div class="form-field" style="flex:1 1 160px; margin:0;">
                    <label class="form-field__label" for="status">Status</label>
                    <select id="status" name="status" class="form-field__select">
                        <option th:each="opt : ${statusOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (status != null ? status : '')}">Status</option>
                    </select>
                </div>
                <div class="form-field" style="flex:1 1 180px; margin:0;">
                    <label class="form-field__label" for="memberType">Member type</label>
                    <select id="memberType" name="memberType" class="form-field__select">
                        <option th:each="opt : ${memberTypeOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (memberType != null ? memberType : '')}">Member type</option>
                    </select>
                </div>
                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-search"></use></svg>
                    Search
                </button>
            </form>
        </div>
    </section>

    <section class="panel">
        <div th:if="${not #lists.isEmpty(rows)}" class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th th:each="col : ${columns}" scope="col"
                            th:classappend="${col.align() == 'right'} ? 'data-table__col-right' : ''"
                            th:with="sortable=${col.sortable()},
                                     active=${sortable and #strings.equals(col.sortKey(), currentSort)},
                                     nextDir=${#strings.equals(currentDir, 'asc')} ? 'desc' : 'asc',
                                     ariaSortValue=${not sortable} ? null : (${not active} ? 'none' : (${#strings.equals(currentDir, 'desc')} ? 'descending' : 'ascending'))"
                            th:aria-sort="${ariaSortValue}">
                            <a th:if="${sortable}" class="data-table__sort"
                               th:href="@{/users/all(q=${q}, status=${status}, memberType=${memberType},
                                                      sort=${col.sortKey()}, dir=${active} ? ${nextDir} : 'asc')}">
                                <span th:text="${col.label()}">Label</span>
                                <svg class="icon" aria-hidden="true">
                                    <use th:if="${active and #strings.equals(currentDir, 'asc')}" href="/icons.svg#icon-chevron-up"></use>
                                    <use th:if="${active and #strings.equals(currentDir, 'desc')}" href="/icons.svg#icon-chevron-down"></use>
                                    <use th:unless="${active}" href="/icons.svg#icon-chevrons-up-down"></use>
                                </svg>
                            </a>
                            <span th:unless="${sortable}" th:text="${col.label()}">Label</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <th:block th:each="row : ${rows}">
                        <tr th:replace="~{user/member-fragments :: allMemberRow}"></tr>
                    </th:block>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(rows)}">
            <div th:replace="~{components/empty-state :: emptyState('users', 'No members match your filters.', null, null)}"></div>
        </div>

        <nav th:if="${not #lists.isEmpty(rows)}" class="pagination" aria-label="Pagination"
             th:with="windowStart=${T(java.lang.Math).max(1, page - 2)},
                      windowEnd=${T(java.lang.Math).min(totalPages, page + 2)}">
            <p class="pagination__range">
                Showing <span class="font-mono" th:text="${firstItem} + '–' + ${lastItem}">1–20</span>
                of <span class="font-mono" th:text="${totalItems}">214</span>
            </p>
            <div class="pagination__controls">
                <a th:if="${page > 1}" class="icon-btn" aria-label="Previous page"
                   th:href="@{/users/all(q=${q}, status=${status}, memberType=${memberType}, sort=${currentSort}, dir=${currentDir}, page=${page - 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </a>
                <button th:unless="${page > 1}" type="button" class="icon-btn" disabled aria-label="Previous page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </button>

                <a th:each="p : ${#numbers.sequence(windowStart, windowEnd)}" th:text="${p}"
                   th:href="@{/users/all(q=${q}, status=${status}, memberType=${memberType}, sort=${currentSort}, dir=${currentDir}, page=${p})}"
                   class="pagination__page" th:classappend="${p == page} ? 'is-current' : ''"
                   th:attr="aria-current=${p == page} ? 'page' : null">1</a>

                <a th:if="${page < totalPages}" class="icon-btn" aria-label="Next page"
                   th:href="@{/users/all(q=${q}, status=${status}, memberType=${memberType}, sort=${currentSort}, dir=${currentDir}, page=${page + 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </a>
                <button th:unless="${page < totalPages}" type="button" class="icon-btn" disabled aria-label="Next page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </button>
            </div>
        </nav>
    </section>

</div>
</body>
</html>
