<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Step 1 of password reset. Same standalone-page reasoning as login.html. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('lms-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage unavailable — OS preference applies */ }
        })();
    </script>
    <title th:text="${pageTitle} + ' · Library Management System'">Forgot password · Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="content" style="max-width: var(--modal-width); margin-inline: auto;">

    <div class="sidebar__brand" style="justify-content: center; padding-block: var(--space-24);">
        <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-library-big"></use></svg>
        <span class="sidebar__brand-name">Library Management System</span>
    </div>

    <section class="panel">
        <div class="panel__header">
            <h1 class="panel__title">Forgot password</h1>
        </div>
        <div class="panel__body" style="display:flex; flex-direction:column; gap: var(--space-16);">

            <!-- Same confirmation either way, whether or not the email is
                 registered — see PasswordResetService.requestReset's javadoc
                 for why. -->
            <div th:if="${submitted}" class="empty-state">
                <svg class="icon empty-state__icon" aria-hidden="true"><use href="/icons.svg#icon-mail"></use></svg>
                <p class="empty-state__text">If that email has an account, a reset link has been sent to it. The link stays valid for 30 minutes.</p>
                <a th:href="@{/login}" class="btn btn--primary">Back to sign in</a>
            </div>

            <!-- th:unless, not th:if="${not submitted}" — GET never puts
                 "submitted" in the model at all (only the POST success path
                 does), and SpEL's own not operator throws on a null
                 operand instead of treating it as false. th:unless doesn't
                 have that problem: it converts the expression to a boolean
                 with Thymeleaf's own (null-safe) rules first. -->
            <form th:unless="${submitted}" th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post"
                  style="display:flex; flex-direction:column; gap: var(--space-16);">
                <p class="form-field__help">Enter the email on your account and we'll send a link to reset your password.</p>

                <div th:replace="~{components/form-field :: formField('email', 'Email', 'email', null, true, null, null, null)}"></div>

                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-mail"></use></svg>
                    Send reset link
                </button>
            </form>
        </div>
    </section>

    <p style="text-align:center; padding-block: var(--space-16); color: var(--ink-2);">
        <a th:href="@{/login}">Back to sign in</a>
    </p>
</div>

<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
