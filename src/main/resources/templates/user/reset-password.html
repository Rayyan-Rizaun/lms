<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Step 2 of password reset — reached from the link PasswordResetMailer logs. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('lms-theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage unavailable — OS preference applies */ }
        })();
    </script>
    <title th:text="${pageTitle} + ' · Library Management System'">Reset password · Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="content" style="max-width: var(--modal-width); margin-inline: auto;">

    <div class="sidebar__brand" style="justify-content: center; padding-block: var(--space-24);">
        <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-library-big"></use></svg>
        <span class="sidebar__brand-name">Library Management System</span>
    </div>

    <section class="panel">
        <div class="panel__header">
            <h1 class="panel__title">Reset password</h1>
        </div>
        <div class="panel__body" style="display:flex; flex-direction:column; gap: var(--space-16);">

            <div th:if="${tokenInvalid}" class="empty-state">
                <svg class="icon empty-state__icon" aria-hidden="true"><use href="/icons.svg#icon-triangle-alert"></use></svg>
                <p class="empty-state__text">This reset link is invalid or has expired. Request a new one.</p>
                <a th:href="@{/forgot-password}" class="btn btn--primary">Request a new link</a>
            </div>

            <!-- form-field needs a th:object; the hidden token carries no
                 label, so it is bound directly with th:field rather than
                 through that fragment. -->
            <!-- th:unless, not th:if="${not tokenInvalid}" — see
                 forgot-password.html's comment on the same fix: the valid-
                 token path never puts "tokenInvalid" in the model, and
                 SpEL's not operator throws on a null operand rather than
                 treating it as false. -->
            <form th:unless="${tokenInvalid}" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post"
                  style="display:flex; flex-direction:column; gap: var(--space-16);">
                <input type="hidden" th:field="*{token}" />

                <div th:replace="~{components/form-field :: formField('newPassword', 'New password', 'password',
                        'At least 8 characters.', true, null, null, null)}"></div>
                <div th:replace="~{components/form-field :: formField('confirmPassword', 'Confirm new password', 'password', null, true, null, null, null)}"></div>

                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-key-round"></use></svg>
                    Set new password
                </button>
            </form>
        </div>
    </section>

    <p style="text-align:center; padding-block: var(--space-16); color: var(--ink-2);">
        <a th:href="@{/login}">Back to sign in</a>
    </p>
</div>

<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>
<script th:src="@{/js/app-shell.js}"></script>
</body>
</html>
