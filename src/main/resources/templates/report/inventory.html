<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">Inventory Report · Library Management System</title>
</head>
<body>
<div id="content">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('Inventory Report', 'Copies by status, most-borrowed titles, titles with nothing available.', 'All Reports', @{/reports}, null)}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/reports/inventory}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="margin:0;">
                    <label class="form-field__label" for="from">Borrowed from</label>
                    <input type="date" id="from" name="from" th:value="${from}" class="form-field__input" />
                </div>
                <div class="form-field" style="margin:0;">
                    <label class="form-field__label" for="to">Borrowed to</label>
                    <input type="date" id="to" name="to" th:value="${to}" class="form-field__input" />
                </div>
                <div class="form-field" style="flex:1 1 200px; margin:0;">
                    <label class="form-field__label" for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId" class="form-field__select">
                        <option th:each="opt : ${categoryOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (categoryId != null ? categoryId.toString() : '')}">Category</option>
                    </select>
                </div>
                <button type="submit" class="btn btn--primary">Run report</button>
            </form>
        </div>
    </section>

    <div th:replace="~{components/stat-tile :: statTileRow(${tiles})}"></div>

    <section class="panel">
        <div class="panel__header">
            <h2 class="panel__title">Copies by status</h2>
        </div>
        <div th:replace="~{components/data-table :: dataTable(${statusColumns}, ${statusRows}, ~{report/report-fragments :: inventoryStatusRow},
                null, null, 'book-open', 'No copies in the catalogue yet.', null, null)}"></div>
    </section>

    <section class="panel">
        <div class="panel__header">
            <h2 class="panel__title">Most-borrowed titles</h2>
        </div>
        <div th:replace="~{components/data-table :: dataTable(${titleColumns}, ${titleRows}, ~{report/report-fragments :: inventoryTitleRow},
                null, null, 'arrow-left-right', 'No loans in this range.', null, null)}"></div>
    </section>

    <section class="panel">
        <div class="panel__header">
            <h2 class="panel__title">Titles with nothing available</h2>
        </div>
        <div th:replace="~{components/data-table :: dataTable(${nothingAvailableColumns}, ${nothingAvailableRows}, ~{report/report-fragments :: inventoryTitleRow},
                null, null, 'circle-check', 'Every title has a copy available.', null, null)}"></div>
    </section>

</div>
</body>
</html>
