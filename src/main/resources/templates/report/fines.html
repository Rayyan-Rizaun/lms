<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">Fines Report · Library Management System</title>
</head>
<body>
<div id="content">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('Fines Report', 'Assessed, collected, waived and outstanding totals.', 'All Reports', @{/reports}, null)}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/reports/fines}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="margin:0;">
                    <label class="form-field__label" for="from">Assessed from</label>
                    <input type="date" id="from" name="from" th:value="${from}" class="form-field__input" />
                </div>
                <div class="form-field" style="margin:0;">
                    <label class="form-field__label" for="to">Assessed to</label>
                    <input type="date" id="to" name="to" th:value="${to}" class="form-field__input" />
                </div>
                <div class="form-field" style="flex:1 1 160px; margin:0;">
                    <label class="form-field__label" for="fineType">Fine type</label>
                    <select id="fineType" name="fineType" class="form-field__select">
                        <option th:each="opt : ${fineTypeOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (fineType != null ? fineType : '')}">Type</option>
                    </select>
                </div>
                <button type="submit" class="btn btn--primary">Run report</button>
            </form>
        </div>
    </section>

    <div th:replace="~{components/stat-tile :: statTileRow(${tiles})}"></div>

    <section class="panel">
        <div th:replace="~{components/data-table :: dataTable(${columns}, ${rows}, ~{report/report-fragments :: finesRow},
                null, null, 'wallet', 'No fines assessed in this range.', null, null)}"></div>
    </section>

</div>
</body>
</html>
