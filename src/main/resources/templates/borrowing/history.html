<!DOCTYPE html>
<!--
    UC-03 — Loan History: every Returned loan, searchable by member or book
    title, paginated. Staff-only.

    No sortable columns — unlike catalogue/books.html or
    feedback/manage-list.html, this task only asked for "searchable... with
    pagination," not sorting, so this stays the simpler shape: a fixed
    newest-return-first order (BorrowingService#loanHistory), a hand-built
    search box and pagination bar (still hand-built, not
    components/pagination — its own ?page=N-only links would drop q, same
    reasoning those two screens document).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">Loan History · Library Management System</title>
</head>
<body>
<div id="content">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('Loan History', 'Every returned loan.', null, null, null)}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/borrowing/history}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="flex:1 1 260px; margin:0;">
                    <label class="form-field__label" for="q">Search</label>
                    <input type="search" id="q" name="q" th:value="${q}" class="form-field__input"
                           placeholder="Member or book title" />
                </div>
                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-search"></use></svg>
                    Search
                </button>
            </form>
        </div>
    </section>

    <section class="panel">
        <div th:if="${not #lists.isEmpty(rows)}" class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col">Member</th>
                        <th scope="col">Book</th>
                        <th scope="col" class="data-table__col-right">Borrowed</th>
                        <th scope="col" class="data-table__col-right">Returned</th>
                        <th scope="col" class="data-table__col-right">Days overdue</th>
                        <th scope="col" class="data-table__col-right">Fine</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td th:text="${row.memberName()}">Name</td>
                        <td><span class="book-title" th:text="${row.bookTitle()}">Title</span></td>
                        <td class="data-table__col-right font-mono" th:text="${#temporals.format(row.borrowedAt(), 'yyyy-MM-dd')}">2026-01-01</td>
                        <td class="data-table__col-right font-mono" th:text="${#temporals.format(row.returnedAt(), 'yyyy-MM-dd')}">2026-01-15</td>
                        <td class="data-table__col-right font-mono" th:text="${row.daysOverdue()}">0</td>
                        <td class="data-table__col-right font-mono" th:text="${row.fineAmount()} ?: '—'">—</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(rows)}">
            <div th:replace="~{components/empty-state :: emptyState('arrow-left-right', 'No returned loans match your search.', null, null)}"></div>
        </div>

        <!-- Hand-built for the same reason the search box above needs to
             be: pagination must carry q, which components/pagination's
             own ?page=N-only links would drop. firstItem/lastItem come
             from the controller (a plain long), not an inline
             Math.min(int, long) here — see LoanController#history. -->
        <nav th:if="${not #lists.isEmpty(rows)}" class="pagination" aria-label="Pagination"
             th:with="windowStart=${T(java.lang.Math).max(1, page - 2)},
                      windowEnd=${T(java.lang.Math).min(totalPages, page + 2)}">
            <p class="pagination__range">
                Showing <span class="font-mono" th:text="${firstItem} + '–' + ${lastItem}">1–20</span>
                of <span class="font-mono" th:text="${totalItems}">214</span>
            </p>
            <div class="pagination__controls">
                <a th:if="${page > 1}" class="icon-btn" aria-label="Previous page"
                   th:href="@{/borrowing/history(q=${q}, page=${page - 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </a>
                <button th:unless="${page > 1}" type="button" class="icon-btn" disabled aria-label="Previous page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </button>

                <a th:each="p : ${#numbers.sequence(windowStart, windowEnd)}" th:text="${p}"
                   th:href="@{/borrowing/history(q=${q}, page=${p})}"
                   class="pagination__page" th:classappend="${p == page} ? 'is-current' : ''"
                   th:attr="aria-current=${p == page} ? 'page' : null">1</a>

                <a th:if="${page < totalPages}" class="icon-btn" aria-label="Next page"
                   th:href="@{/borrowing/history(q=${q}, page=${page + 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </a>
                <button th:unless="${page < totalPages}" type="button" class="icon-btn" disabled aria-label="Next page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </button>
            </div>
        </nav>
    </section>

</div>
</body>
</html>
