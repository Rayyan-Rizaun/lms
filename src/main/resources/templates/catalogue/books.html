<!DOCTYPE html>
<!--
    UC-02 / PB-22, PB-23 — the public catalogue list and search screen.
    Reachable without logging in (SecurityConfig permits GET
    /catalogue/books) so a guest can browse and search before ever
    creating an account. Uses the normal app shell — CurrentUserAdvice's
    defaults (authenticated=false, "Guest", no roles) render this exactly
    the same for a guest as any other page, just with the topbar's
    "Log in / Create account" menu instead of a profile.

    SORTING AND PAGINATION ARE HAND-BUILT, NOT components/data-table's or
    components/pagination's own header/page links. Both fragments say so
    themselves: their links carry only ?sort=&dir= / ?page=N and drop every
    other query parameter — fine for a plain list, wrong here where a
    guest's search text and filters must survive clicking a column header
    or a page number (templates/components/README.md's data-table section
    says exactly this: "if your screen filters AND sorts, build the header
    links yourself"). The table below reuses every one of data-table.html's
    CSS classes and markup shape — sticky header, chevrons, the empty-state
    swap — just with `th:href` that also carries q / categoryId /
    availableOnly, so a click never silently resets the guest's search.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">Books · Library Management System</title>
</head>
<body>
<div id="content" th:with="isStaff=${authenticated and (currentRoleNames.contains('Librarian') or currentRoleNames.contains('Library Administrator'))}">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('Books', 'Search the catalogue by title, author, ISBN or keyword.',
            ${isStaff} ? 'Add Book' : null, ${isStaff} ? @{/catalogue/books/new} : null, 'plus')}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/catalogue/books}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="flex:2 1 240px; margin:0;">
                    <label class="form-field__label" for="q">Search</label>
                    <input type="search" id="q" name="q" th:value="${q}" class="form-field__input"
                           placeholder="Title, author, ISBN or keyword" />
                </div>
                <div class="form-field" style="flex:1 1 180px; margin:0;">
                    <label class="form-field__label" for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId" class="form-field__select">
                        <option th:each="opt : ${categoryOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (categoryId != null ? categoryId.toString() : '')}">Category</option>
                    </select>
                </div>
                <div class="form-field" style="flex:0 0 auto; margin:0; padding-block-end: var(--space-8);">
                    <label class="form-field__label" style="display:flex; align-items:center; gap: var(--space-8); font-weight:400;">
                        <input type="checkbox" name="availableOnly" value="true" th:checked="${availableOnly}" />
                        Available only
                    </label>
                </div>
                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-search"></use></svg>
                    Search
                </button>
            </form>
        </div>
    </section>

    <section class="panel">
        <div th:if="${not #lists.isEmpty(rows)}" class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th th:each="col : ${columns}" scope="col"
                            th:classappend="${col.align() == 'right'} ? 'data-table__col-right' : ''"
                            th:with="sortable=${col.sortable()},
                                     active=${sortable and #strings.equals(col.sortKey(), currentSort)},
                                     nextDir=${#strings.equals(currentDir, 'asc')} ? 'desc' : 'asc',
                                     ariaSortValue=${not sortable} ? null : (${not active} ? 'none' : (${#strings.equals(currentDir, 'desc')} ? 'descending' : 'ascending'))"
                            th:aria-sort="${ariaSortValue}">
                            <a th:if="${sortable}" class="data-table__sort"
                               th:href="@{/catalogue/books(q=${q}, categoryId=${categoryId}, availableOnly=${availableOnly},
                                                            sort=${col.sortKey()}, dir=${active} ? ${nextDir} : 'asc')}">
                                <span th:text="${col.label()}">Label</span>
                                <svg class="icon" aria-hidden="true">
                                    <use th:if="${active and #strings.equals(currentDir, 'asc')}" href="/icons.svg#icon-chevron-up"></use>
                                    <use th:if="${active and #strings.equals(currentDir, 'desc')}" href="/icons.svg#icon-chevron-down"></use>
                                    <use th:unless="${active}" href="/icons.svg#icon-chevrons-up-down"></use>
                                </svg>
                            </a>
                            <span th:unless="${sortable}" th:text="${col.label()}">Label</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td>
                            <a th:href="@{/catalogue/books/{id}(id=${row.bookId})}" class="book-title" th:text="${row.title}">Title</a>
                        </td>
                        <td th:text="${row.authorName}">Author</td>
                        <td class="font-mono" th:text="${row.isbn13}">ISBN</td>
                        <td th:text="${row.categoryNames}">Category</td>
                        <td class="data-table__col-right font-mono" th:text="${row.publicationYear} ?: '—'">2024</td>
                        <td class="data-table__col-right font-mono" th:text="${row.availableCopies} + ' / ' + ${row.totalCopies}">3 / 5</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(rows)}">
            <div th:replace="~{components/empty-state :: emptyState('search', 'No books match your search.', null, null)}"></div>
        </div>

        <!-- Hand-built for the same reason the header links above are: it must
             carry q / categoryId / availableOnly, which components/pagination's
             own ?page=N-only links would drop. -->
        <nav th:if="${not #lists.isEmpty(rows)}" class="pagination" aria-label="Pagination"
             th:with="firstItem=${totalItems == 0 ? 0 : (page - 1) * pageSize + 1},
                      lastItem=${totalItems == 0 ? 0 : T(java.lang.Math).min((page * pageSize) + 0L, totalItems)},
                      windowStart=${T(java.lang.Math).max(1, page - 2)},
                      windowEnd=${T(java.lang.Math).min(totalPages, page + 2)}">
            <p class="pagination__range">
                Showing <span class="font-mono" th:text="${firstItem} + '–' + ${lastItem}">1–20</span>
                of <span class="font-mono" th:text="${totalItems}">214</span>
            </p>
            <div class="pagination__controls">
                <a th:if="${page > 1}" class="icon-btn" aria-label="Previous page"
                   th:href="@{/catalogue/books(q=${q}, categoryId=${categoryId}, availableOnly=${availableOnly}, sort=${currentSort}, dir=${currentDir}, page=${page - 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </a>
                <button th:unless="${page > 1}" type="button" class="icon-btn" disabled aria-label="Previous page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </button>

                <a th:each="p : ${#numbers.sequence(windowStart, windowEnd)}" th:text="${p}"
                   th:href="@{/catalogue/books(q=${q}, categoryId=${categoryId}, availableOnly=${availableOnly}, sort=${currentSort}, dir=${currentDir}, page=${p})}"
                   class="pagination__page" th:classappend="${p == page} ? 'is-current' : ''"
                   th:attr="aria-current=${p == page} ? 'page' : null">1</a>

                <a th:if="${page < totalPages}" class="icon-btn" aria-label="Next page"
                   th:href="@{/catalogue/books(q=${q}, categoryId=${categoryId}, availableOnly=${availableOnly}, sort=${currentSort}, dir=${currentDir}, page=${page + 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </a>
                <button th:unless="${page < totalPages}" type="button" class="icon-btn" disabled aria-label="Next page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </button>
            </div>
        </nav>
    </section>

</div>
</body>
</html>
