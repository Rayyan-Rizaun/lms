<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: shell(~{::title}, ~{::#content})}">
<head>
    <title th:text="${pageTitle} + ' · Library Management System'">Review Moderation · Library Management System</title>
</head>
<body>
<div id="content">

    <div th:replace="~{components/toast :: flash(${flashSuccessTitle}, ${flashSuccessMessage}, ${flashErrorTitle}, ${flashErrorMessage})}"></div>

    <div th:replace="~{components/page-header :: pageHeader('Review Moderation', 'Pending reviews first, then flagged, then everything else.', null, null, null)}"></div>

    <section class="panel">
        <div class="panel__body">
            <form method="get" th:action="@{/reviews/moderation}" class="cluster" style="align-items:flex-end;">
                <div class="form-field" style="flex:2 1 220px; margin:0;">
                    <label class="form-field__label" for="q">Search</label>
                    <input type="search" id="q" name="q" th:value="${q}" class="form-field__input"
                           placeholder="Book or member" />
                </div>
                <div class="form-field" style="flex:1 1 160px; margin:0;">
                    <label class="form-field__label" for="status">Status</label>
                    <select id="status" name="status" class="form-field__select">
                        <option th:each="opt : ${statusOptions}" th:value="${opt.value()}" th:text="${opt.label()}"
                                th:selected="${opt.value() == (status != null ? status : '')}">Status</option>
                    </select>
                </div>
                <button type="submit" class="btn btn--primary">
                    <svg class="icon icon--sm" aria-hidden="true"><use href="/icons.svg#icon-search"></use></svg>
                    Search
                </button>
            </form>
        </div>
    </section>

    <section class="panel">
        <div th:if="${not #lists.isEmpty(rows)}" class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col">Book</th>
                        <th scope="col">Member</th>
                        <th scope="col" class="data-table__col-right">Rating</th>
                        <th scope="col">Review</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="data-table__col-right">Flags</th>
                        <th scope="col" class="data-table__col-right">Submitted</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row : ${rows}">
                        <td><a th:href="@{/reviews/moderation/{id}(id=${row.reviewId()})}" class="book-title" th:text="${row.bookTitle()}">Title</a></td>
                        <td th:text="${row.memberName()}">Name</td>
                        <td class="data-table__col-right font-mono" th:text="${row.rating()} + ' / 5'">4 / 5</td>
                        <td th:text="${row.reviewExcerpt()} ?: '—'">Review text.</td>
                        <td><span th:replace="~{components/status-pill :: statusPill('review', ${row.status()})}"></span></td>
                        <td class="data-table__col-right font-mono" th:text="${row.flagCount()}">0</td>
                        <td class="data-table__col-right font-mono" th:text="${#temporals.format(row.submittedAt(), 'yyyy-MM-dd')}">2026-01-01</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(rows)}">
            <div th:replace="~{components/empty-state :: emptyState('star', 'No reviews match your filters.', null, null)}"></div>
        </div>

        <nav th:if="${not #lists.isEmpty(rows)}" class="pagination" aria-label="Pagination"
             th:with="windowStart=${T(java.lang.Math).max(1, page - 2)},
                      windowEnd=${T(java.lang.Math).min(totalPages, page + 2)}">
            <p class="pagination__range">
                Showing <span class="font-mono" th:text="${firstItem} + '–' + ${lastItem}">1–20</span>
                of <span class="font-mono" th:text="${totalItems}">214</span>
            </p>
            <div class="pagination__controls">
                <a th:if="${page > 1}" class="icon-btn" aria-label="Previous page"
                   th:href="@{/reviews/moderation(q=${q}, status=${status}, page=${page - 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </a>
                <button th:unless="${page > 1}" type="button" class="icon-btn" disabled aria-label="Previous page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-left"></use></svg>
                </button>

                <a th:each="p : ${#numbers.sequence(windowStart, windowEnd)}" th:text="${p}"
                   th:href="@{/reviews/moderation(q=${q}, status=${status}, page=${p})}"
                   class="pagination__page" th:classappend="${p == page} ? 'is-current' : ''"
                   th:attr="aria-current=${p == page} ? 'page' : null">1</a>

                <a th:if="${page < totalPages}" class="icon-btn" aria-label="Next page"
                   th:href="@{/reviews/moderation(q=${q}, status=${status}, page=${page + 1})}">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </a>
                <button th:unless="${page < totalPages}" type="button" class="icon-btn" disabled aria-label="Next page">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-chevron-right"></use></svg>
                </button>
            </div>
        </nav>
    </section>

</div>
</body>
</html>
